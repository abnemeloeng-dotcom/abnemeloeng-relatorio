<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="pinClip">
      <path d="M256 48 C161 48 84 125 84 220 C84 350 256 464 256 464 C256 464 428 350 428 220 C428 125 351 48 256 48 Z"/>
    </clipPath>
  </defs>

  <!-- fundo: quadrado arredondado azul-marinho (mesmo tom do cabeçalho do app) -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#1a3a5c"/>

  <!-- pino de localização, dourado (mesma cor dos botões de destaque do app) -->
  <path d="M256 48 C161 48 84 125 84 220 C84 350 256 464 256 464 C256 464 428 350 428 220 C428 125 351 48 256 48 Z" fill="#b8863b"/>

  <!-- dentro do pino: um círculo azul-marinho fazendo as vezes de "olho" da câmera -->
  <circle cx="256" cy="205" r="88" fill="#1a3a5c" clip-path="url(#pinClip)"/>

  <!-- abertura/íris da câmera, em dourado, dentro do círculo -->
  <g fill="#b8863b" clip-path="url(#pinClip)">
    <path d="M 256.0 175.0 L 295.0 137.5 L 282.0 190.0 Z"/>
    <path d="M 282.0 190.0 L 334.0 205.0 L 282.0 220.0 Z"/>
    <path d="M 282.0 220.0 L 295.0 272.5 L 256.0 235.0 Z"/>
    <path d="M 256.0 235.0 L 217.0 272.5 L 230.0 220.0 Z"/>
    <path d="M 230.0 220.0 L 178.0 205.0 L 230.0 190.0 Z"/>
    <path d="M 230.0 190.0 L 217.0 137.5 L 256.0 175.0 Z"/>
  </g>
  <circle cx="256" cy="205" r="14" fill="#1a3a5c" clip-path="url(#pinClip)"/>

  <!-- selo de "comprovado" no canto do pino -->
  <circle cx="357" cy="330" r="46" fill="#1e7d3c" stroke="#1a3a5c" stroke-width="8"/>
  <path d="M337 330 L350 344 L378 312" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
